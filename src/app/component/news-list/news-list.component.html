<div class="container my-5">
    <div class="card mb-3 w-100 m-auto">
        <div class="row g-0">
            <div class="col-md-4">
                <img src="assets/images/default.png" class="w-100 rounded-start" alt="...">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title">Card title</h5>
                    <p class="card-text">This is a wider card with supporting text below as a natural lead-in to
                        additional content. This content is a little bit longer.</p>
                    <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
                </div>
            </div>
        </div>
    </div>
    <div class="cont-MK mt-4 d-flex justify-content-center align-items-center">
        <div class="row">
            @for(item of currentNews();track $index){
            <div class="col-lg-3 d-flex justify-content-center align-items-center">
                <app-news  [itemInfo]="item"></app-news>
            </div>
            }
        </div>
    </div>
    <nav aria-label="Page navigation example ">
        <ul class="pagination  m-auto mt-4 justify-content-center">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>
</div>
